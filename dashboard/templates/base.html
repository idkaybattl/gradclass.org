{% load static %}

<!DOCTYPE html>

<html lang="de">

<head>
    <meta charset="UTF-8">
    <!-- refresh page every 5 mins -->
    <meta http-equiv="refresh" content="300">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- favicon -->
    <link rel="icon" type="image/png" href="{% static 'dashboard/icons/favicon.ico/favicon-96x96.png' %}"
        sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{% static 'dashboard/icons/favicon.ico/favicon.svg'' %}" />
    <link rel="shortcut icon" href="{% static 'dashboard/icons/favicon.ico/favicon.ico' %}" />
    <link rel="apple-touch-icon" sizes="180x180"
        href="{% static 'dashboard/icons/favicon.ico/apple-touch-icon.png' %}" />
    <meta name="apple-mobile-web-app-title" content="gc.org" />
    <link rel="manifest" href="{% static 'dashboard/icons/favicon.ico/site.webmanifest' %}" />

    <!-- styling -->
    <link rel="stylesheet" href="{% static 'dashboard/css/vars.css' %}" />
    <link rel="stylesheet" href="{% static 'dashboard/css/base.css' %}" />

    <title>{% block 'title' %}WHG Abi 2028 Verwaltung {% endblock %}</title>

    {% block base_head %}
    {% endblock %}

</head>

<body>

    <nav>
        <a href="/" class="nav-item">
            <img src="{% static 'dashboard/icons/hanging-square.svg' %}" alt="Abi 28" class="logo" />
        </a>
        <div class="nav-items">
            {% if user.is_authenticated %}
            <a class="nav-item">
                <img src="{% static 'dashboard/icons/bell.svg' %}" alt="Mitteilungen" class="logo" />
            </a>
            <a class="nav-item">
                <img src="{% static 'dashboard/icons/circle.svg' %}" alt="Profil" class="logo" />
            </a>
            <a class="nav-item">
                <img src="{% static 'dashboard/icons/menu.svg' %}" alt="Menu" class="logo" />
            </a>
            {% endif %}
        </div>
    </nav>

    <main>
        <div class="content-container">
            <div class="content-block">
                {% block content %}
                {% endblock %}
            </div>
            <footer>
                <!-- Contact, Instagram, Tiktok -->
                {% if user.is_authenticated %}
                <div class="footer-items">
                    <a href="{% url 'contact' %}" class="footer-item">
                        <img src="{% static 'dashboard/icons/phone.svg' %}" alt="Kontakt" class="logo">
                    </a>
                </div>
                <div class="footer-items">
                    <a class="footer-item">
                        <img src="{% static 'dashboard/icons/images.svg' %}" alt="Gallerie" class="logo">
                    </a>
                    <a class="footer-item">
                        <img src="{% static 'dashboard/icons/instagram.svg' %}" alt="Gallerie" class="logo">
                    </a>
                    <a class="footer-item">
                        <img src="{% static 'dashboard/icons/tiktok.svg' %}" alt="Gallerie" class="logo">
                    </a>
                </div>
                {% endif %}
            </footer>
        </div>
        <div class="overlay" role="dialog" aria-label="Dialog">
            <div class="overlay-handle" aria-hidden="true"></div>
            <button type="button" class="overlay-close" aria-label="Schließen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
            <div class="overlay-content"></div>
        </div>
    </main>

    <script src="{% static 'dashboard/js/base.js' %}" defer></script>

</body>

</html>
