<section class="feedback feedback--{{ feedback.kind|default:'info' }}" role="status" aria-live="polite">
    <h2 class="feedback__title" data-overlay-title tabindex="-1">{{ feedback.title }}</h2>
    {% if feedback.message %}
    <p class="feedback__message">{{ feedback.message }}</p>
    {% endif %}
    {% if feedback.actions %}
    <div class="feedback__actions">
        {% for action in feedback.actions %}
        <a class="btn" href="{{ action.url }}" {% if action.htmx %}data-overlay-open="overlay" hx-get="{{ action.url }}"
            hx-target="#overlay-content" hx-swap="innerHTML" {% endif %}>{{ action.label }}</a>
        {% endfor %}
    </div>
    {% endif %}
</section>
