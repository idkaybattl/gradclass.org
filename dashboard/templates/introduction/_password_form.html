<form class="intro-form" method="post" action="{% url 'set-password' %}" hx-post="{% url 'set-password' %}"
    hx-target="#step-5" hx-swap="innerHTML" hx-validate="true">
    {% csrf_token %}

    <p class="intro-note">
        Tipp: Das gleiche Passwort wie auf IServ wäre vielleicht am einfachsten.
    </p>

    {{ password_form.non_field_errors }}

    {% for field in password_form %}
    <div class="field">
        {{ field.errors }}
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}
        <div class="field__help">{{ field.help_text }}</div>
        {% endif %}
    </div>
    {% endfor %}

    <div class="intro-step__actions">
        <button type="submit" class="btn" hx-disabled-elt="this">Fertig</button>
    </div>
</form>
