<form class="intro-form" method="post" action="{% url 'set-password' %}" hx-post="{% url 'set-password' %}"
    hx-target="#intro-password" hx-swap="innerHTML" hx-validate="true">
    {% csrf_token %}
    <div class="intro-step__text">
        <h2 class="intro-step__title">Passwort festlegen</h2>
        <p class="intro-note">
            Du kannst dein Passwort später jederzeit im Profil ändern.
        </p>
    </div>

    {{ password_form.non_field_errors }}

    {% for field in password_form %}
    <div class="field">
        {{ field.errors }}
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}
        <div class="field__help">{{ field.help_text }}</div>
        {% endif %}
    </div>
    {% endfor %}

    <div class="intro-step__actions">
        <button type="submit" class="btn" hx-disabled-elt="this">Weiter</button>
        <button type="button" class="btn" data-from="intro-password" data-to="intro-closing">Zurück</button>
    </div>
</form>
