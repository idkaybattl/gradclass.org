{% extends 'base.html' %}

{% load static %}

{% block base_head %}
<link rel="stylesheet" href="{% static 'dashboard/css/index.css' %}" />
{% endblock %}

{% block content %}
<div class="main-grid">
    <section class="card gallery">
        <h2>Gallerie</h2>
    </section>

    <div class="main-panels">
        <a class="card todos" href="{% url 'events-upcoming' %}">
            <h2>Anstehendes</h2>
        </a>
        <section class="card news">
            <h2>Neuigkeiten</h2>
        </section>
        <a class="card polls" href="{% url 'polls' %}">
            <h2>Abstimmungen</h2>
        </a>
        <section class="card fund">
            <h2>Abikasse</h2>
            <p class="fund__amount">{{ abikasse_current|floatformat:2 }} €</p>
            <hr class="fund__divider" />
            <p class="fund__amount">{{ abikasse_goal|floatformat:2 }} €</p>
        </section>
        <a class="card profile" href="{% url 'user-details' user.id %}" data-overlay-open="overlay"
            hx-get="{% url 'user-details' user.id %}" hx-target="#overlay-content" hx-swap="innerHTML">
            <h2>Profil</h2>
        </a>
    </div>
</div>
{% endblock %}
