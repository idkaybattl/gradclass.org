<div class="popup-content">
    <div class="popup-header">
        <h2>{{ join_request.requestor.first_name }} {{ join_request.requestor.last_name }} möchte {{ join_request.event }} beitreten.</h2>
    </div>
    <div class="popup-body">
        <button hx-post="{% url "accept-join-request" join_request.pk %}" hx-swap="none" hx-on::after-request="closeAllPopups()">Annehmen</button>
        <button hx-post="{% url "decline-join-request" join_request.pk %}" hx-swap="none" hx-on::after-request="closeAllPopups()">Ablehnen</button>
    </div>
</div>
